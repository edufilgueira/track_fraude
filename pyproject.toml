[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "track-fraude"
version = "0.1.0"
description = "Worker de processamento — vídeo + POS + fraude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "track-fraude-core @ file:./core",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pytesseract>=0.3.10",
  "python-dateutil>=2.8.0",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
track = ["ultralytics>=8.0.0", "lap>=0.5.12"]
dev = ["pytest>=7.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "core/src", "."]
testpaths = ["tests"]
