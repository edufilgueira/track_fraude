apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: track-fraude
spec:
  secretTargetRef:
    - parameter: host
      name: track-fraude-secrets
      key: rabbitmq-url
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: track-fraude-worker
  namespace: track-fraude
spec:
  pollingInterval: 10
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  maxReplicaCount: 1
  jobTargetRef:
    backoffLimit: 0
    template:
      spec:
        restartPolicy: Never
        runtimeClassName: nvidia
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: track-fraude/gpu
                      operator: In
                      values: ["true"]
        containers:
          - name: worker
            image: 10.10.0.100:5000/track-fraude-worker:latest
            # Always: containerd checa o digest do :latest a cada job. As camadas base
            # (~8 GB) ficam em cache no node; só a camada do app (pequena) é re-baixada
            # após rebuild/push. Evita o "stale image" do IfNotPresent (que não rebaixa :latest).
            imagePullPolicy: Always
            command:
              - python
              - jobs/run_pipeline_queue_worker.py
            # URL do RabbitMQ vem do Secret (app-config.yaml → rabbitmq-url).
            # Não coloque o IP aqui; edite só infra/k8s/app-config.yaml (Passo 10.4).
            env:
              - name: PIPELINE_QUEUE_URL
                valueFrom:
                  secretKeyRef:
                    name: track-fraude-secrets
                    key: rabbitmq-url
              - name: PIPELINE_QUEUE_NAME
                value: track-fraude-pipelines
              - name: TRACK_FRAUDE_DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: track-fraude-secrets
                    key: postgres-url
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['job-name']
              - name: PYTHONUNBUFFERED
                value: "1"
              # Copia raw do NFS para disco local do pod antes do track (evita I/O lento frame a frame).
              - name: TRACK_FRAUDE_RAW_CACHE_DIR
                value: /cache/raw
              - name: TRACK_FRAUDE_DATA_ROOT
                value: /app/data
            resources:
              limits:
                nvidia.com/gpu: 1
            volumeMounts:
              - name: data
                mountPath: /app/data
              - name: raw-cache
                mountPath: /cache/raw
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: track-fraude-data
          - name: raw-cache
            emptyDir: {}
  triggers:
    - type: rabbitmq
      metadata:
        queueName: track-fraude-pipelines
        mode: QueueLength
        value: "1"
        protocol: amqp
      authenticationRef:
        name: rabbitmq-trigger-auth
