[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Metadados do painel web. Instalação: pip install -r requirements.txt
# (core editável + FastAPI). O código em server/ roda via main.py (PYTHONPATH = raiz do repo).

[project]
name = "track-fraude-server"
version = "0.1.0"
description = "Painel web — login, cadastro de lojas e OCR ROI"
requires-python = ">=3.10"
dependencies = [
  "track-fraude-core @ file:../core",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1.0",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27.0"]
