app:
  name: track_fraude
  host: 0.0.0.0
  port: 8080
  secret_key: troque-esta-chave-em-producao

database:
  # Relativo à raiz do repo (track_fraude/) ou absoluto (local, UNC, rede)
  path: data/track_fraude.db

auth:
  admin_username: admin
  admin_password: admin123
  admin_display_name: Administrador

# Python do worker (track-fraude + pyarrow + ultralytics).
# Deixe vazio para detectar automaticamente (.venv na raiz ou python do sistema).

pipeline:
  # local = executa subprocesso nesta máquina; queue = publica demanda no RabbitMQ/KEDA.
  mode: local
  python:
  queue_url: amqp://guest:guest@rabbitmq:5672/%2F
  queue_name: track-fraude-pipelines
